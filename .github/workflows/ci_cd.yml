# Название вашего пайплайна
name: Automate Version and Push to Docker

#Триггер на события, которые производятся по пушу или мерджу 
# on:
#   push:
#     branches: [ "master", "develop" ]
on:
  pull_request:
    # На какие типы событий он должен работать
    #types: [opened, synchronize, reopened, closed, assigned, unassigned, labeled, unlabeled, edited]
    types: [closed]
    branches:
      - release
env:
  NAME_VERSION_FILE: ${{ github.workspace }}/version/version
  RELEASE_BRACH: release
  MINOR: minor
  PATCH: patch
  VERSION_UP: .github/workflows/version_up.py
  REPO_NAME: ${{ github.event.repository.name }}
  PR_NUMBER: ${{ github.event.number }}
  URL_REPO: ${{ github.server_url }}/${{ github.repository }}

#JOBS list for update versions 
jobs:
  pre-merge-check:
    runs-on: ubuntu-latest
    steps:
      
      # use special lib for parse branch names 
      - name: Get branch names
        id: branch-names
        uses: tj-actions/branch-names@v8
      
      # print info about variables and parsed branches
      - name: Print info
        id: print-info
        run: |
          echo "EVENT NAME    : ${{ github.event_name }}"
          echo "ACTION        : ${{ github.event.action }}"
          echo "EVENT NAME    : ${{ github.event_name }}"
          echo "IS            : ${{ github.event.pull_request.merged }}"
          echo "CURRENT BRANCH: ${{ steps.branch-names.outputs.current_branch }}"
          echo "REF           : ${{ github.ref }}"
          echo "REF NAME      : ${{ github.ref_name }}"
          echo "DEFAULT BRANCH: ${{ steps.branch-names.outputs.default_branch }}"
          echo "WOKSPACE      : ${{ github.workspace }} "
      
        
  # start update version files       
  update-version:
    # IMPORTANT!
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{steps.get-commit-txt.outputs.TAG_MSG}}
    needs: pre-merge-check
    steps:      

      # use special lib for parse branch names 
      - name: Get branch names
        id: branch-names
        uses: tj-actions/branch-names@v8

      # checkout on branch 
      - name: Сheckout on [${{env.RELEASE_BRACH}}]
        uses: actions/checkout@v2
      
      # promt path to version file 
      - name: Promt catalog's info
        run : |
          echo "path to version file ${{ env.NAME_VERSION_FILE }}"
          
      # Setup python env 
      - name: Install and Setup python 
        uses: actions/setup-python@v1
        with:
          python-version: "3.10"
    
      # update version if branch start with feature
      - name: Update version [minor]
        if: startsWith(steps.branch-names.outputs.current_branch,'feature')
        run: 
          python ${{env.VERSION_UP}} ${{ env.NAME_VERSION_FILE }} ${{ env.MINOR }}
 
      # update version if bracnh start with feature
      - name: Update version [patch]
        if: startsWith(steps.branch-names.outputs.current_branch,'hotfix')
        run:
          python ${{env.VERSION_UP}} ${{ env.NAME_VERSION_FILE }} ${{ env.PATCH }}
      
      # generate variables for commit and tag 
      - name: Save Version and Log to env
        id: get-commit-txt
        run: | 
          COMMIT_MSG=$(python ${{env.VERSION_UP}} ${{ env.NAME_VERSION_FILE }} version_log -1)
          TAG_MSG=$(python ${{env.VERSION_UP}} ${{ env.NAME_VERSION_FILE }} version)
          echo "COMMIT_MSG=${COMMIT_MSG}" >> $GITHUB_ENV
          echo "TAG_MSG=${TAG_MSG}" >> $GITHUB_ENV
          echo "TAG_MSG=${TAG_MSG}" >> $GITHUB_OUTPUT
      
      # setup user which will be commit
      # setup the username and email. I tend to use 'GitHub Actions Bot' with no email by default
      - name: Setup git config
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"

      # add and push to remote repository 
      - name: Update [version] and put [tag]
        run: |
          git add .
          git commit -m "${{ env.COMMIT_MSG }}"
          git tag -a v${{ env.TAG_MSG }} -m "update tag"
          git push -u origin ${{ env.RELEASE_BRACH }} --tags 
  
  # create changelog file and put data to file 
  changelog-fixme:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: update-version
    steps:
      - name: Prepare enviroments
        run: |
          echo "update chnagelog file"
      # checkout on branch 
      - name: Сheckout on [${{env.RELEASE_BRACH}}]
        uses: actions/checkout@v2

  # create changelog file and put data to file 
  build-fixme:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: changelog-fixme
    steps:
      - name: Prepare enviroments
        run: |
          echo "start build application"
      # checkout on branch 
      - name: Сheckout on [${{env.RELEASE_BRACH}}]
        uses: actions/checkout@v2

  # create changelog file and put data to file 
  tests-fixme:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: changelog-fixme
    steps:
      - name: Prepare enviroments
        run: |
          echo "update chnagelog file"
      # checkout on branch 
      - name: Starting tests
        uses: actions/checkout@v2
  
  # telegram notify about all tests
  tests-notify:
    needs: tests-fixme
    runs-on: ubuntu-latest
    steps:
      - name: send telegram message on push
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            GitHub (https://github.com/makarmarkov/land_devops/releases/tag/v0.6.0)
            Release v0.6.0 · makarmarkov/land_devops
            update tag
            
            Новый выпуск изменений
            Обновление проекта Название проекта
            Проект : land_devops
            Версия : 0.6.0
            Дата: 28.02.2024 17:33:44
            
            Информация о репозитории
            GIT MR : 71 (https://github.com/makarmarkov/land_devops/pull/71)
            GIT TAG: 0.6.0 (https://github.com/makarmarkov/land_devops/releases/tag/v0.6.0)
            
            Информация о Docker
            Владелец: makarmarkov  (https://hub.docker.com/repositories/makarmarkov)
            Название: land_devops (https://hub.docker.com/repository/docker/makarmarkov/land_devops/general)
            Тег: v0.6.0 (https://hub.docker.com/repository/docker/makarmarkov/land_devops/tags)
            Полное имя: makarmarkov/land_devops:v0.6.0 (https://hub.docker.com/repository/docker/makarmarkov/land_devops/tags/v0.6.0/sha256:07451c2658178285458b52572db3aa7d1dccf7caac22a801e37ca73b27206576)
  


  # build docker image and push to registry
  docker-push:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [tests-notify,update-version]
    env: 
      tag: ${{needs.update-version.outputs.tag}}
    steps:
      - name: Prepare env 
        run: | 
          echo "show variables"
          echo [${{env.tag}}]
      # checkout on branch 
      - name: Сheckout on [${{env.RELEASE_BRACH}}] and v [${{env.tag}}]
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push Docker image to DockerHub
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_LOGIN }}/${{env.REPO_NAME}}:v${{env.tag}}
  
  # telegram notify about all tests
  final-notify:
    needs: tests-fixme
    runs-on: ubuntu-latest
    steps:
      # use special lib for parse branch names 
      - name: Get branch names
        id: branch-names
        uses: tj-actions/branch-names@v8

      # use for get time value
      - name: Get current time
        uses: josStorer/get-current-time@v2
        id: current-time
        with:
          format: YYYYMMDD-HH
          utcOffset: "+08:00"
      
      #print info about time
      - name: Use current time
        env:
          TIME: "${{ steps.current-time.outputs.time }}"
          R_TIME: "${{ steps.current-time.outputs.readableTime }}"
          F_TIME: "${{ steps.current-time.outputs.formattedTime }}"
          YEAR: "${{ steps.current-time.outputs.year }}"
          DAY: "${{ steps.current-time.outputs.day }}"
        run: echo $TIME $R_TIME $F_TIME $YEAR $DAY
      
      - name: send telegram message on push
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |           
            Новый выпуск изменений
            <b>Проект</b> : ${{ env.REPO_NAME }}
            <b>Версия</b> : ${{ steps.branch-names.outputs.tag }}
            <b>Дата</b>: 28.02.2024 17:33:44
            
            Информация о репозитории
            <b>GIT MR</b> : <a href="${{env.URL_REPO}}/pull/${{ env.PR_NUMBER }}">${{ env.PR_NUMBER }}</a>
            <b>GIT TAG</b>: <a href="${{env.URL_REPO}}releases/tag/v${{ steps.branch-names.outputs.tag }}">${{ steps.branch-names.outputs.tag }}</a>
            
            Информация о Docker
            <b>Владелец</b>: makarmarkov  (https://hub.docker.com/repositories/makarmarkov)
            <b>Название</b>: land_devops (https://hub.docker.com/repository/docker/makarmarkov/land_devops/general)
            <b>Тег</b>: v${{ steps.branch-names.outputs.tag }} (https://hub.docker.com/repository/docker/makarmarkov/land_devops/tags)
            <b>Полное имя</b>: ${{ secrets.DOCKER_HUB_LOGIN }}/${{ env.REPO_NAME }}:v${{ steps.branch-names.outputs.tag }}
  
    


      
        
    
      
    

  
