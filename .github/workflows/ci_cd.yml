# Название вашего пайплайна
name: Version update runner

#Триггер на события, которые производятся по пушу или мерджу 
# on:
#   push:
#     branches: [ "master", "develop" ]
on:
  pull_request:
    # На какие типы событий он должен работать
    #types: [opened, synchronize, reopened, closed, assigned, unassigned, labeled, unlabeled, edited]
    types: [closed]
    branches:
      - release
env:
  TYPE_BRANCH: none
  NAME_VERSION_FILE: version/version
  RELEASE_BRACH: release

#JOBS list for update versions 
jobs:
  pre-merge-check:
    runs-on: ubuntu-latest
    outputs:
      type_branch_f: ${{ steps.feature-branch.outputs.type_branch_f }}
      type_branch_h: ${{ steps.hotfix-branch.outputs.type_branch_h }}
    steps:
      
      # use special lib for parse branch names 
      - name: Get branch names
        id: branch-names
        uses: tj-actions/branch-names@v8
      
      # print info about variables and parsed branches
      - name: Print info
        id: print-info
        run: |
          echo "EVENT NAME    : ${{ github.event_name }}"
          echo "ACTION        : ${{ github.event.action }}"
          echo "EVENT NAME    : ${{ github.event_name }}"
          echo "IS            : ${{ github.event.pull_request.merged}}"
          echo "CURRENT BRANCH: ${{ steps.branch-names.outputs.current_branch }}"
          echo "REF           : ${{ github.ref}}"
          echo "REF NAME      : ${{ github.ref_name}}"
          echo "DEFAULT BRANCH: ${{ steps.branch-names.outputs.default_branch }}"
          echo "WOKSPACE      : ${{ github.workspace }} "
      
      # check if branch feature 
      - name: Check decalared branch 
        id: feature-branch
        if: contains(steps.branch-names.outputs.current_branch,'feature')
        run: | 
          echo "Merge [feature] -> [release]"
          echo "type_branch_f=feature" >> "$GITHUB_OUTPUT"
              
        
  # SHow VERSION FILE
  generate-version:
    runs-on: ubuntu-latest
    #wait pre merge check 
    needs: pre-merge-check
    outputs:
      data_in_file: ${{steps.get-info.outputs.content}}
    #steps by step
    steps:
        # Show current directory 
      - name: Search current directory
        run: pwd

        # checkout on release branch and 
        # show content of version file 
      - name: checkout
        uses: actions/checkout@v2

        #Show old content of version file 
      - name: Print info about ${{env.NAME_VERSION_FILE}} 
        id: get-info
        run: |
          content=$(cat ${{env.NAME_VERSION_FILE}})
          echo "content='$content'" >> "$GITHUB_OUTPUT"
        
  # start update version files       
  update-version:
    # IMPORTANT!
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: generate-version
    steps:      

      # use special lib for parse branch names 
      - name: Get branch names
        id: branch-names
        uses: tj-actions/branch-names@v8

      # checkout on branch 
      - name: checkout
        uses: actions/checkout@v2
      
      # Setup python env 
      - name: Setup python 
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
          cache: "poetry"

      # update version if bracnh start with feature
      - name: Update MINOR
        if: startsWith(steps.branch-names.outputs.current_branch,'feature')
        run: 
          py version_up.py ${{ github.workspace }} minor
      
      # update version if bracnh start with feature
      - name: Update PATCH
        if: startsWith(steps.branch-names.outputs.current_branch,'feature')
        run: 
          py version_up.py ${{ github.workspace }} patch

      # setup user which will be commit
      # setup the username and email. I tend to use 'GitHub Actions Bot' with no email by default
      - name: setup git config for github bot 
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"

      # generate string for commit message 
      - name: Get last version from version_log file 
        id: get-commit-txt
        run: | 
          COMMIT_MSG=$(py version_up.py ${{ github.workspace }} version_log -1)
          TAG_MSG=$(py version_up.py ${{ github.workspace }} version)
          echo "COMMIT_MSG=${COMMIT_MSG}" >> $GITHUB_ENV
          echo "TAG_MSG=${TAG_MSG}" >> $GITHUB_ENV

      # add and push to remote repository 
      - name: commit modify [version] file
        run: |
          git add .
          git commit -m "${{ steps.get-commit-txt.outputs.COMMIT_MSG }}"
          git tag -a v${{ steps.get-commit-txt.outputs.TAG_MSG }} -m "update tag"
          git push origin ${{ env.TYPE_BRANCH }} --tags 

              
      
    

  
